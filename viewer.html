<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>RTX HDR Image Booster — Local Files</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #16181d;
    color: #e6e6e6;
    font: 14px/1.4 -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 20px;
    border-bottom: 1px solid #2a2d34;
    position: sticky;
    top: 0;
    background: #16181d;
    z-index: 1;
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; color: #a9e34b; }
  .actions { display: flex; gap: 8px; }
  button {
    background: #2a2d34;
    color: #e6e6e6;
    border: 1px solid #3a3d44;
    border-radius: 6px;
    padding: 7px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover { background: #34373f; }
  button:active { transform: translateY(1px); }
  button.primary { background: #4d7c1f; border-color: #4d7c1f; }
  button.primary:hover { background: #5c9424; }
  #hint {
    padding: 60px 20px;
    text-align: center;
    color: #8b8f98;
  }
  #single {
    display: none;
    padding: 20px;
    text-align: center;
  }
  #single .backlink {
    display: none;
    margin-bottom: 12px;
    color: #a9e34b;
    cursor: pointer;
    font-size: 13px;
  }
  #single .fshint {
    margin-top: 10px;
    color: #8b8f98;
    font-size: 11.5px;
  }
  #singleMedia img, #singleMedia video {
    max-width: 100%;
    max-height: 80vh;
    border-radius: 8px;
  }
  #grid {
    display: none;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 12px;
    padding: 16px 20px;
  }
  .cell {
    background: #1a1d23;
    border: 1px solid #2a2d34;
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    position: relative;
  }
  .cell img, .cell video {
    width: 100%;
    height: 120px;
    object-fit: cover;
    display: block;
  }
  .cell .name {
    padding: 6px 8px;
    font-size: 11px;
    color: #9aa0aa;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .cell .badge {
    position: absolute;
    top: 6px;
    right: 6px;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 10px;
    background: #1f3a1a;
    color: #7ee081;
  }
</style>
</head>
<body>
  <header>
    <h1>RTX HDR Image Booster — Local Files</h1>
    <div class="actions">
      <button id="openPicture">Open Picture</button>
      <button id="openFolder">Open Folder</button>
      <button id="convertAll" class="primary" style="display:none;">Convert All</button>
    </div>
  </header>
  <div id="hint">Open a single picture to HDR-convert it immediately, or open a folder to browse and convert images from it.</div>
  <div id="single">
    <span class="backlink" id="backToGrid">← Back to folder</span>
    <div id="singleMedia"></div>
    <div class="fshint">Didn't go fullscreen automatically? Double-click the video to toggle it.</div>
  </div>
  <div id="grid"></div>
  <input type="file" id="pictureInput" accept="image/*" style="display:none;" />
  <input type="file" id="folderInput" webkitdirectory multiple style="display:none;" />
  <script src="viewer.js"></script>
</body>
</html>
